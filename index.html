<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" href="/brand/nexis-icon-green.png" type="image/png" />
    <link rel="shortcut icon" href="/brand/nexis-icon-green.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexis" />

    <!-- Primary Meta -->
    <title>Nexis — Business Management for Ghana SMEs</title>
    <meta name="description" content="Nexis is an all-in-one business management platform for Ghanaian SMEs. POS, invoicing, inventory, MoMo payments, reports and more. By GENESIS." />
    <meta name="author" content="GENESIS" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a3a22" />
    <!-- Fonts: preconnect early, then async-load CSS so font bytes arrive ASAP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexis" />
    <meta property="og:title" content="Nexis — Business Management for Ghana SMEs" />
    <meta property="og:description" content="All-in-one POS, inventory, invoicing and business analytics built for Ghanaian small businesses. Accept MoMo, manage stock, and grow. By GENESIS." />
    <meta property="og:image" content="https://nexus-ghana.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Nexis — Business Management for Ghana SMEs" />
    <meta property="og:url" content="https://nexus-ghana.vercel.app/" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexis — Business Management for Ghana SMEs" />
    <meta name="twitter:description" content="All-in-one POS, inventory, invoicing and analytics for Ghanaian businesses. By GENESIS." />
    <meta name="twitter:image" content="https://nexus-ghana.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Nexis Dashboard Preview" />

    <!-- Canonical -->
    <link rel="canonical" href="https://nexus-ghana.vercel.app/" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://nexus-ghana.vercel.app/#website",
            "url": "https://nexus-ghana.vercel.app/",
            "name": "Nexis",
            "description": "Business Management for Ghana SMEs",
            "publisher": {
              "@id": "https://nexus-ghana.vercel.app/#organization"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://nexus-ghana.vercel.app/#organization",
            "name": "Nexis",
            "url": "https://nexus-ghana.vercel.app/",
            "logo": "https://nexus-ghana.vercel.app/favicon.png",
            "description": "All-in-one POS, inventory, invoicing and business analytics built for Ghanaian small businesses."
          }
        ]
      }
    </script>

    <!-- Google Analytics (GA4) - Replace G-XXXXXXXXXX with your actual GA4 Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Configure your Measurement ID here
      gtag('config', 'G-XXXXXXXXXX');
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
